<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pan · prototipo</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }  /* color de las barras laterales: cámbialo aquí y en #stage */
  body {
    position: fixed; inset: 0; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  /* Pantalla completa donde viven los frames */
  #stage {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    overflow: hidden; touch-action: none; cursor: grab; background: #000;
  }
  #stage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;   /* el valor real se controla con FIT en la configuración */
    display: none; pointer-events: none; -webkit-user-drag: none;
  }
  #stage img.on { display: block; }

  /* Destello */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash    { animation: flash .35s ease-out; }
  .flash-sm { animation: flashSm .25s ease-out; }
  @keyframes flash   { 0% { opacity: var(--fm, .55); } 100% { opacity: 0; } }
  @keyframes flashSm { 0% { opacity: var(--fs, .22); } 100% { opacity: 0; } }

  /* Quiebre principal: sacudida fuerte */
  .crack-main    { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(3px, 1px); }
    30%, 50%, 70% { transform: translate(-6px, -1px); }
    40%, 60% { transform: translate(6px, 2px); }
  }

  /* Quiebre pequeño: al separarse el pan */
  .crack-small { animation: shakeSm .3s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shakeSm {
    20%, 80% { transform: translate(1px, 0); }
    40%, 60% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
  }

  /* Guía transparente: dos dedos que se separan (solo en la primera foto) */
  #hint { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .45s ease; }
  #hint.show { opacity: 1; }
  .pair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: scaleX(-1) rotate(-18deg); --d: min(22vw, 130px); }  /* scaleX(-1) = flip horizontal */
  .ghost {
    position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.7);
    background: radial-gradient(circle, rgba(255,255,255,.45), rgba(255,255,255,.12));
    box-shadow: 0 0 28px rgba(255,255,255,.35);
  }
  .ghost.a { animation: ghostA 2.4s ease-in-out infinite; }
  .ghost.b { animation: ghostB 2.4s ease-in-out infinite; }
  @keyframes ghostA {
    0%   { transform: translateX(-24px) scale(1.15); opacity: 0; }
    15%  { transform: translateX(-24px) scale(.92);  opacity: .9; }
    70%  { transform: translateX(calc(var(--d) * -1)) scale(.92); opacity: .9; }
    90%, 100% { transform: translateX(calc(var(--d) * -1)) scale(1); opacity: 0; }
  }
  @keyframes ghostB {
    0%   { transform: translateX(24px) scale(1.15); opacity: 0; }
    15%  { transform: translateX(24px) scale(.92);  opacity: .9; }
    70%  { transform: translateX(var(--d)) scale(.92); opacity: .9; }
    90%, 100% { transform: translateX(var(--d)) scale(1); opacity: 0; }
  }
  #hintText {
    position: absolute; left: 50%; top: calc(50% + 110px); transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 40px); text-align: center;
    padding: 10px 18px; border-radius: 999px;
    font-size: 15px; font-weight: 500; letter-spacing: .02em; color: #fff;
    background: rgba(0,0,0,.55);                       /* fondo translúcido para contraste */
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.18);
  }
  #hintText:empty { display: none; }
</style>
</head>
<body>

<div id="stage"><div id="flash"></div></div>

<div id="hint">
  <div class="pair"><div class="ghost a"></div><div class="ghost b"></div></div>
  <div id="hintText"></div>
</div>

<script>
/* =====================  CONFIGURACIÓN  =====================
   Carpeta "img" junto a este archivo. Puedes escribir el nombre con o
   sin extensión: si no la pones, se prueba png, jpg, jpeg y webp.
   Si una imagen no existe, se muestra un wireframe automático. */
const FRAMES = [
  'img/Pan 1',
  'img/Pan 2',
  'img/Pan 3',
  'img/Pan 4',
  'img/Pan 5',
];
const FIT          = 'cover';              // 'cover' = pantalla completa (llena y recorta) · 'contain' = imagen COMPLETA con barras
const BREAK_FRAME  = 2;                    // quiebre PRINCIPAL (0-based): 2 = Pan 3, la mitad
const SECOND_FRAME = 4;                    // quiebre PEQUEÑO: 4 = Pan 5, cuando se separa
const PULL_RANGE   = 0.55;                 // fracción del ancho que hay que separar los dedos
const DRAG_RANGE   = 1.0;                  // respaldo con 1 dedo / mouse: arrastre horizontal

const VIBRATE_TICK   = 8;                  // ms, vibración leve entre frames
const VIBRATE_BREAK  = [40, 30, 90, 30, 40]; // patrón del quiebre principal
const VIBRATE_SECOND = [18, 25, 28];       // patrón del quiebre pequeño

const HINT_DELAY  = 800;                   // ms sin tocar (en la primera foto) para mostrar la guía de dedos
const HINT_TEXT   = 'auto';                // 'auto' = texto según dispositivo · '' = sin texto · o escribe el tuyo
const FLASH_MAIN  = 0.55;                  // intensidad del destello blanco en el quiebre principal (0 = sin destello)
const FLASH_SMALL = 0.22;                  // intensidad del destello en el quiebre pequeño
/* =========================================================== */

const stage = document.getElementById('stage');
const flash = document.getElementById('flash');
const N = FRAMES.length;
const canVibrate = 'vibrate' in navigator;
const hintEl = document.getElementById('hint');
const isTouch = matchMedia('(pointer:coarse)').matches;
document.getElementById('hintText').textContent = HINT_TEXT === 'auto'
  ? (isTouch ? 'Separa los dos dedos para partir el pan' : 'Arrastra para partir el pan')
  : HINT_TEXT;
let idleSince = performance.now();
stage.style.setProperty('--fm', FLASH_MAIN);
stage.style.setProperty('--fs', FLASH_SMALL);

/* ---------- Wireframe automático si falta la imagen ---------- */
function wireframe(i) {
  const split = i >= BREAK_FRAME;
  const grey = 60 + i * 18;
  const w = 90 + i * 14;
  const gap = split ? 25 + (i - BREAK_FRAME) * 25 : 0;
  const shapes = split
    ? `<ellipse cx="${300 - gap}" cy="270" rx="${w / 2}" ry="55" fill="#999" transform="rotate(-12 ${300 - gap} 270)"/>
       <ellipse cx="${300 + gap}" cy="270" rx="${w / 2}" ry="55" fill="#999" transform="rotate(12 ${300 + gap} 270)"/>`
    : `<ellipse cx="300" cy="270" rx="${w}" ry="55" fill="#999"/>`;
  const tag = i === BREAK_FRAME ? ' · SE PARTE' : (i === SECOND_FRAME ? ' · SE SEPARA' : '');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540">
    <rect width="600" height="540" fill="rgb(${grey},${grey},${grey})"/>
    <path d="M0 0L600 540M600 0L0 540" stroke="#ffffff22" stroke-width="2"/>
    ${shapes}
    <text x="300" y="60" fill="#fff" font-family="sans-serif" font-size="26" text-anchor="middle">FRAME ${i + 1}${tag}</text>
    <text x="300" y="500" fill="#ffffffaa" font-family="sans-serif" font-size="18" text-anchor="middle">${FRAMES[i]}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- Carga de imágenes (prueba extensiones; si no hay, wireframe) ---------- */
const EXTS = ['png', 'jpg', 'jpeg', 'webp'];
const HAS_EXT = /\.(png|jpe?g|webp|avif|gif)$/i;
const imgs = FRAMES.map((base, i) => {
  const img = new Image();
  img.draggable = false;
  img.style.objectFit = FIT;
  if (FIT === 'cover') img.style.transform = 'scale(1.06)';   // margen para que la sacudida no muestre bordes
  const candidates = HAS_EXT.test(base) ? [base] : EXTS.map(ext => `${base}.${ext}`);
  let k = 0;
  const tryNext = () => {
    if (k < candidates.length) img.src = encodeURI(candidates[k++]);
    else { img.onerror = null; img.src = wireframe(i); }
  };
  img.onerror = tryNext;
  tryNext();
  stage.insertBefore(img, flash);
  return img;
});

/* ---------- Estado ---------- */
let cur = 0, target = 0, dragging = false;
let sx = 0, sp = 0, d0 = 1, vp = 0, last = -1;

const vib = p => { try { canVibrate && navigator.vibrate(p); } catch (e) {} };

function crack(kind) {
  const main = kind === 'main';
  stage.classList.remove('crack-main', 'crack-small');
  flash.classList.remove('flash', 'flash-sm');
  void stage.offsetWidth;                       // reinicia las animaciones
  stage.classList.add(main ? 'crack-main' : 'crack-small');
  flash.classList.add(main ? 'flash' : 'flash-sm');
}

function show(i) {
  if (i === last) return;
  imgs.forEach((m, k) => m.classList.toggle('on', k === i));
  if (last >= 0) {
    if (last < BREAK_FRAME && i >= BREAK_FRAME)        { vib(VIBRATE_BREAK);  crack('main'); }
    else if (last < SECOND_FRAME && i >= SECOND_FRAME) { vib(VIBRATE_SECOND); crack('small'); }
    else vib(VIBRATE_TICK);
  }
  last = i;
}

/* ---------- Bucle de animación ---------- */
function loop() {
  cur = dragging ? target : cur + (target - cur) * 0.22;
  if (Math.abs(target - cur) < 0.0005) cur = target;

  show(Math.max(0, Math.min(N - 1, Math.round(cur * (N - 1)))));

  // Guía de dedos: aparece en la primera foto si no hay interacción; se oculta al tocar
  if (dragging) { idleSince = performance.now(); hintEl.classList.remove('show'); }
  else if (last === 0 && performance.now() - idleSince > HINT_DELAY) hintEl.classList.add('show');
  else if (last !== 0) hintEl.classList.remove('show');

  // Tensión: crece hasta el quiebre principal y queda un temblor suave hasta la separación
  const t = (dragging && last < SECOND_FRAME)
    ? (last < BREAK_FRAME ? Math.min(1, cur * (N - 1) / BREAK_FRAME) : 0.35) : 0;
  if (t > 0.05 && Math.abs(cur - vp) > 0.035) { vp = cur; vib(Math.round(3 + t * 14)); }
  if (!dragging) vp = cur;
  stage.style.transform = t > 0.05
    ? `translate(${(Math.random() - .5) * t * 6}px, ${(Math.random() - .5) * t * 6}px)` : '';

  requestAnimationFrame(loop);
}

/* ---------- Gestos: 2 dedos separándose = romper el pan ---------- */
const pts = new Map();
const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
function rebase() { sp = target; if (pts.size >= 2) d0 = dist(); else sx = [...pts.values()][0].x; }

stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragging = true; rebase();
});

stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const d = pts.size >= 2
    ? (dist() - d0) / (innerWidth * PULL_RANGE)
    : (e.clientX - sx) / (stage.clientWidth * DRAG_RANGE);
  target = Math.max(0, Math.min(1, sp + d));
});

function release(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size > 0) { rebase(); return; }
  dragging = false;
  // Si no llegó a partirse vuelve al inicio; si ya se partió, termina solo
  target = Math.round(target * (N - 1)) >= BREAK_FRAME ? 1 : 0;
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
document.addEventListener('gesturestart', e => e.preventDefault());   // evita zoom en iOS

show(0);
loop();
</script>
</body>
</html>
