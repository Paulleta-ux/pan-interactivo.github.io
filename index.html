<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pan · prototipo</title>
<style>
  :root { --ar: 1.40625; }                         /* proporción de la imagen (se calcula sola desde tu primera foto) */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; }  /* color de las barras: cámbialo aquí */
  body {
    position: fixed; inset: 0; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }

  /* Escenario: toma EXACTAMENTE el tamaño (proporción) de la imagen y se centra, lo más grande posible */
  #stage {
    position: fixed; inset: 0; margin: auto; overflow: hidden;
    width: min(100vw, calc(100dvh * var(--ar)));
    height: min(100dvh, calc(100vw / var(--ar)));
  }
  #stage img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center;    /* mismo aspecto que el escenario: no recorta */
    display: none; pointer-events: none; -webkit-user-drag: none;
  }
  #stage img.on { display: block; }

  /* Modo "llenar pantalla" (FIT_MODE = 'fill'): cubre todo y recorta un poco */
  html.fill #stage { width: 100vw; height: 100dvh; }
  html.fill #stage img { transform: scale(1.06); }

  /* Capa que recibe los gestos en toda la pantalla */
  #touch { position: fixed; inset: 0; touch-action: none; cursor: grab; z-index: 1; }

  /* Destello */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash    { animation: flash .35s ease-out; }
  .flash-sm { animation: flashSm .25s ease-out; }
  @keyframes flash   { 0% { opacity: var(--fm, .55); } 100% { opacity: 0; } }
  @keyframes flashSm { 0% { opacity: var(--fs, .22); } 100% { opacity: 0; } }

  /* Quiebres: sacudida fuerte (principal) y leve (pequeño) */
  .crack-main  { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
  .crack-small { animation: shakeSm .3s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(3px, 1px); }
    30%, 50%, 70% { transform: translate(-6px, -1px); }
    40%, 60% { transform: translate(6px, 2px); }
  }
  @keyframes shakeSm {
    20%, 80% { transform: translate(1px, 0); }
    40%, 60% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
  }

  /* Guía transparente: dos dedos que se separan (solo en la primera foto) */
  #hint { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .45s ease; z-index: 2; }
  #hint.show { opacity: 1; }
  .pair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: scaleX(-1) rotate(-18deg); --d: min(22vw, 130px); }
  .ghost {
    position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.7);
    background: radial-gradient(circle, rgba(255,255,255,.45), rgba(255,255,255,.12));
    box-shadow: 0 0 28px rgba(255,255,255,.35);
  }
  .ghost.a { animation: ghostA 2.4s ease-in-out infinite; }
  .ghost.b { animation: ghostB 2.4s ease-in-out infinite; }
  @keyframes ghostA {
    0%   { transform: translateX(-24px) scale(1.15); opacity: 0; }
    15%  { transform: translateX(-24px) scale(.92);  opacity: .9; }
    70%  { transform: translateX(calc(var(--d) * -1)) scale(.92); opacity: .9; }
    90%, 100% { transform: translateX(calc(var(--d) * -1)) scale(1); opacity: 0; }
  }
  @keyframes ghostB {
    0%   { transform: translateX(24px) scale(1.15); opacity: 0; }
    15%  { transform: translateX(24px) scale(.92);  opacity: .9; }
    70%  { transform: translateX(var(--d)) scale(.92); opacity: .9; }
    90%, 100% { transform: translateX(var(--d)) scale(1); opacity: 0; }
  }
  #hintText {
    position: absolute; left: 50%; top: calc(50% + 110px); transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 40px); text-align: center;
    padding: 10px 18px; border-radius: 999px;
    font-size: 15px; font-weight: 500; letter-spacing: .02em; color: #fff;
    background: rgba(0,0,0,.55);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.18);
  }
  #hintText:empty { display: none; }

  /* Botón de pantalla completa */
  #fs {
    position: fixed; z-index: 3; display: none; align-items: center; justify-content: center;
    top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 14px);
    width: 42px; height: 42px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.4); color: #fff;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  #fs svg { width: 20px; height: 20px; }
  #fs .ico-exit { display: none; }
  #fs.on .ico-enter { display: none; }
  #fs.on .ico-exit { display: block; }
</style>
</head>
<body>

<div id="stage"><div id="flash"></div></div>
<div id="touch"></div>

<div id="hint">
  <div class="pair"><div class="ghost a"></div><div class="ghost b"></div></div>
  <div id="hintText"></div>
</div>

<button id="fs" aria-label="Pantalla completa" title="Pantalla completa">
  <svg class="ico-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
  <svg class="ico-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>
</button>

<script>
/* =====================  CONFIGURACIÓN  =====================
   Carpeta "img" junto a este archivo. El nombre puede ir con o sin extensión
   (se prueba png, jpg, jpeg, webp) y también se prueban variantes con
   espacios, guion bajo (_) y guion (-). Si no se encuentra, se muestra un wireframe. */
const FRAMES = [
  'img/Pan_1',
  'img/Pan_2',
  'img/Pan_3',
  'img/Pan_4',
  'img/Pan_5',
];
const FIT_MODE     = 'fit';                // 'fit' = se adapta al tamaño de la imagen (se ve completa) · 'fill' = llena la pantalla y recorta
const ASPECT       = 'auto';               // 'auto' = proporción de tu primera imagen · o un número, ej. 16/9
const FULLSCREEN_BUTTON = true;            // botón de pantalla completa

const BREAK_FRAME  = 2;                    // quiebre PRINCIPAL (0-based): 2 = Pan 3, la mitad
const SECOND_FRAME = 4;                    // quiebre PEQUEÑO: 4 = Pan 5, cuando se separa
const PULL_RANGE   = 0.55;                 // fracción del ancho que hay que separar los dedos
const DRAG_RANGE   = 1.0;                  // respaldo con 1 dedo / mouse: arrastre horizontal

const VIBRATE_TICK   = 8;                  // ms, vibración leve entre frames
const VIBRATE_BREAK  = [40, 30, 90, 30, 40]; // quiebre principal
const VIBRATE_SECOND = [18, 25, 28];       // quiebre pequeño

const HINT_DELAY  = 800;                   // ms sin tocar (en la primera foto) para mostrar la guía de dedos
const HINT_TEXT   = 'auto';                // 'auto' · '' = sin texto · o escribe el tuyo
const FLASH_MAIN  = 0.55;                  // destello en el quiebre principal (0 = sin destello)
const FLASH_SMALL = 0.22;                  // destello en el quiebre pequeño
/* =========================================================== */

const root  = document.documentElement;
const stage = document.getElementById('stage');
const flash = document.getElementById('flash');
const touch = document.getElementById('touch');
const hintEl = document.getElementById('hint');
const N = FRAMES.length;
const canVibrate = 'vibrate' in navigator;
const isTouch = matchMedia('(pointer:coarse)').matches;

if (FIT_MODE === 'fill') root.classList.add('fill');
if (typeof ASPECT === 'number') root.style.setProperty('--ar', ASPECT);
stage.style.setProperty('--fm', FLASH_MAIN);
stage.style.setProperty('--fs', FLASH_SMALL);
document.getElementById('hintText').textContent = HINT_TEXT === 'auto'
  ? (isTouch ? 'Separa los dos dedos para partir el pan' : 'Arrastra para partir el pan')
  : HINT_TEXT;

/* ---------- Wireframe automático si falta la imagen ---------- */
function wireframe(i) {
  const split = i >= BREAK_FRAME;
  const grey = 60 + i * 18;
  const w = 110 + i * 16;
  const gap = split ? 30 + (i - BREAK_FRAME) * 30 : 0;
  const cx = 360, cy = 256;
  const shapes = split
    ? `<ellipse cx="${cx - gap}" cy="${cy}" rx="${w / 2}" ry="62" fill="#999" transform="rotate(-12 ${cx - gap} ${cy})"/>
       <ellipse cx="${cx + gap}" cy="${cy}" rx="${w / 2}" ry="62" fill="#999" transform="rotate(12 ${cx + gap} ${cy})"/>`
    : `<ellipse cx="${cx}" cy="${cy}" rx="${w}" ry="62" fill="#999"/>`;
  const tag = i === BREAK_FRAME ? ' · SE PARTE' : (i === SECOND_FRAME ? ' · SE SEPARA' : '');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="512" viewBox="0 0 720 512">
    <rect width="720" height="512" fill="rgb(${grey},${grey},${grey})"/>
    <path d="M0 0L720 512M720 0L0 512" stroke="#ffffff22" stroke-width="2"/>
    ${shapes}
    <text x="360" y="60" fill="#fff" font-family="sans-serif" font-size="28" text-anchor="middle">FRAME ${i + 1}${tag}</text>
    <text x="360" y="480" fill="#ffffffaa" font-family="sans-serif" font-size="18" text-anchor="middle">${FRAMES[i]}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- Carga de imágenes (prueba variantes de nombre y extensión) ---------- */
const EXTS = ['png', 'jpg', 'jpeg', 'webp'];
const HAS_EXT = /\.(png|jpe?g|webp|avif|gif)$/i;
function candidatesFor(base) {
  const names = [...new Set([base, base.replace(/ /g, '_'), base.replace(/ /g, '-'),
                             base.toLowerCase(), base.toLowerCase().replace(/[ _]/g, '-')])];
  return names.flatMap(n => HAS_EXT.test(n) ? [n] : EXTS.map(e => `${n}.${e}`));
}
const imgs = FRAMES.map((base, i) => {
  const img = new Image();
  img.draggable = false;
  const list = candidatesFor(base);
  let k = 0;
  const tryNext = () => {
    if (k < list.length) img.src = encodeURI(list[k++]);
    else { img.onerror = null; img.onload = null; img.src = wireframe(i); }
  };
  img.onerror = tryNext;
  img.onload = () => {                          // la proporción del escenario sale de tu primera foto real
    if (i === 0 && ASPECT === 'auto' && img.naturalWidth && !img.src.startsWith('data:'))
      root.style.setProperty('--ar', img.naturalWidth / img.naturalHeight);
  };
  tryNext();
  stage.insertBefore(img, flash);
  return img;
});

/* ---------- Estado ---------- */
let cur = 0, target = 0, dragging = false;
let sx = 0, sp = 0, d0 = 1, vp = 0, last = -1;
let idleSince = performance.now();

const vib = p => { try { canVibrate && navigator.vibrate(p); } catch (e) {} };

function crack(kind) {
  const main = kind === 'main';
  stage.classList.remove('crack-main', 'crack-small');
  flash.classList.remove('flash', 'flash-sm');
  void stage.offsetWidth;
  stage.classList.add(main ? 'crack-main' : 'crack-small');
  flash.classList.add(main ? 'flash' : 'flash-sm');
}

function show(i) {
  if (i === last) return;
  imgs.forEach((m, k) => m.classList.toggle('on', k === i));
  if (last >= 0) {
    if (last < BREAK_FRAME && i >= BREAK_FRAME)        { vib(VIBRATE_BREAK);  crack('main'); }
    else if (last < SECOND_FRAME && i >= SECOND_FRAME) { vib(VIBRATE_SECOND); crack('small'); }
    else vib(VIBRATE_TICK);
  }
  last = i;
}

/* ---------- Bucle de animación ---------- */
function loop() {
  cur = dragging ? target : cur + (target - cur) * 0.22;
  if (Math.abs(target - cur) < 0.0005) cur = target;

  show(Math.max(0, Math.min(N - 1, Math.round(cur * (N - 1)))));

  // Guía de dedos: aparece en la primera foto si no hay interacción; se oculta al tocar
  if (dragging) { idleSince = performance.now(); hintEl.classList.remove('show'); }
  else if (last === 0 && performance.now() - idleSince > HINT_DELAY) hintEl.classList.add('show');
  else if (last !== 0) hintEl.classList.remove('show');

  // Tensión: crece hasta el quiebre principal y queda un temblor suave hasta la separación
  const t = (dragging && last < SECOND_FRAME)
    ? (last < BREAK_FRAME ? Math.min(1, cur * (N - 1) / BREAK_FRAME) : 0.35) : 0;
  if (t > 0.05 && Math.abs(cur - vp) > 0.035) { vp = cur; vib(Math.round(3 + t * 14)); }
  if (!dragging) vp = cur;
  stage.style.transform = t > 0.05
    ? `translate(${(Math.random() - .5) * t * 6}px, ${(Math.random() - .5) * t * 6}px)` : '';

  requestAnimationFrame(loop);
}

/* ---------- Gestos (en toda la pantalla): 2 dedos separándose = romper el pan ---------- */
const pts = new Map();
const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
function rebase() { sp = target; if (pts.size >= 2) d0 = dist(); else sx = [...pts.values()][0].x; }

touch.addEventListener('pointerdown', e => {
  touch.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragging = true; rebase();
});

touch.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const d = pts.size >= 2
    ? (dist() - d0) / (innerWidth * PULL_RANGE)
    : (e.clientX - sx) / (innerWidth * DRAG_RANGE);
  target = Math.max(0, Math.min(1, sp + d));
});

function release(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size > 0) { rebase(); return; }
  dragging = false;
  // Si no llegó a partirse vuelve al inicio; si ya se partió, termina solo
  target = Math.round(target * (N - 1)) >= BREAK_FRAME ? 1 : 0;
}
touch.addEventListener('pointerup', release);
touch.addEventListener('pointercancel', release);
document.addEventListener('gesturestart', e => e.preventDefault());   // evita zoom en iOS

/* ---------- Pantalla completa ---------- */
const fsBtn = document.getElementById('fs');
const reqFS  = root.requestFullscreen || root.webkitRequestFullscreen;
const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
const inFS   = () => document.fullscreenElement || document.webkitFullscreenElement;
if (FULLSCREEN_BUTTON && reqFS) {                // en iPhone Safari no existe esta API: el botón se oculta
  fsBtn.style.display = 'flex';
  fsBtn.addEventListener('click', () => {
    try { inFS() ? exitFS.call(document) : reqFS.call(root); } catch (e) {}
  });
  const sync = () => fsBtn.classList.toggle('on', !!inFS());
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
}

show(0);
loop();
</script>
</body>
</html>
